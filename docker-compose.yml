# Desenvolvimento local — portas do host (produção usa docker-compose.prod.yml na 80/443).
services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: crescere-lia-back
    ports:
      - "3001:3000"
    volumes:
      - ./back/src:/app/src
    env_file:
      - ./back/.env
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-sail}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    container_name: crescere-lia-front
    ports:
      - "8081:8080"
    volumes:
      - ./front/src:/app/src
      - ./front/index.html:/app/index.html
      - ./front/public:/app/public
      - ./front/vite.config.ts:/app/vite.config.ts
    env_file:
      - ./front/.env
    environment:
      VITE_API_PROXY_TARGET: http://back:3000
      VITE_USE_AI_CHAT: "true"
    depends_on:
      - back
    restart: unless-stopped
