services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: crescere-lia-back
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:?Defina DB_HOST no .env.production}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env.production}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env.production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1024}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-nova}
      ICLINICA_API_URL: ${ICLINICA_API_URL:-}
      LIA_SYNC_SECRET: ${LIA_SYNC_SECRET:-}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-crescere}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-Crescere}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME no .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env.production}
    expose:
      - "3000"
    networks:
      - lia

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_USE_AI_CHAT: "true"
        VITE_SHOW_JOURNEYS: "true"
        # Produto: mapa emocional e pílulas ficam off no app do cuidador
        VITE_SHOW_EMOTIONAL_MAP: "false"
        VITE_SHOW_QUICK_REPLIES: "false"
    container_name: crescere-lia-front
    restart: unless-stopped
    depends_on:
      - back
    expose:
      - "80"
    networks:
      - lia

  caddy:
    image: caddy:2-alpine
    container_name: crescere-lia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
    networks:
      - lia

networks:
  lia:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
